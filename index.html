<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>有給管理アプリ</title>
<link rel="manifest" href="manifest.json">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#172033;background:#f4f7fb}
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);font-size:16px}
header{background:#2563eb;color:white;padding:18px 16px 20px;position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0 0 4px}.sub{opacity:.9;font-size:13px}
main{max-width:760px;margin:auto;padding:14px}
.card{background:white;border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:0 2px 10px #0000000d}
h2{font-size:18px;margin:0 0 13px}h3{font-size:16px;margin:14px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f7f9fc;border-radius:13px;padding:13px}
.stat b{display:block;font-size:25px;margin-top:3px}.label{font-size:13px;color:#64748b}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.form-row{gap:14px}.grow{flex:1}
input,select,button{font:inherit;border-radius:10px;border:1px solid #d6deea;min-height:44px;padding:9px 11px}
input,select{width:100%;background:white}button{cursor:pointer;background:white;font-weight:600}
button.primary{background:#2563eb;color:#fff;border-color:#2563eb}.danger{color:#dc2626;border-color:#fecaca}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}
.field{min-width:140px;flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.notice{background:#eff6ff;border-left:4px solid #2563eb;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.calendar-head button{min-width:44px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;font-size:12px;color:#64748b;padding:4px}
.day{min-height:48px;border:1px solid #edf0f5;border-radius:9px;padding:5px;font-size:13px;background:#fff;position:relative}
.day.muted{color:#c3cad4;background:#fafafa}.day.today{border:2px solid #2563eb}.day.used{background:#dbeafe;border-color:#93c5fd}
.day .mark{display:block;font-size:10px;color:#2563eb;margin-top:4px;white-space:nowrap;overflow:hidden}
.bar{height:12px;background:#e5e7eb;border-radius:8px;overflow:hidden}.bar>i{display:block;height:100%;background:#2563eb}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 5px;border-bottom:1px solid #edf0f5}th{color:#64748b;font-weight:600}
.empty{text-align:center;color:#94a3b8;padding:16px}.small{font-size:12px;color:#64748b}
footer{text-align:center;color:#94a3b8;font-size:12px;padding:10px 0 28px}

/* iPhone/スマホ向け横並びスタイルの最適化 */
@media(max-width:599px){
  .row {
    display: flex !important;
    flex-direction: row !important;
    gap: 8px !important;
    flex-wrap: nowrap !important;
    align-items: flex-end;
  }
  .row .field {
    flex: 1 1 0% !important;
    min-width: 0 !important;
    width: 0 !important;
  }
  input, select {
    width: 100% !important;
    box-sizing: border-box !important;
    min-width: 0 !important;
    -webkit-appearance: none;
    font-size: 13px;
    padding: 9px 6px;
  }
  .row label {
    margin-top: 0;
    margin-bottom: 5px;
    font-size: 12px;
    white-space: nowrap;
  }
}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><h1>有給管理</h1><div class="sub">残日数・取得履歴をかんたん管理</div></header>
<main>
<section class="card">
<h2>現在の状況</h2>
<div class="grid">
<div class="stat"><span class="label">残日数</span><b id="remain">0日</b></div>
<div class="stat"><span class="label">付与日数</span><b id="grant">0日</b></div>
<div class="stat"><span class="label">今月使用</span><b id="monthUsed">0日</b></div>
<div class="stat"><span class="label">繰越</span><b id="carry">0日</b></div>
</div>
<div style="margin-top:14px"><div class="row"><span class="label">有給使用率</span><span class="grow"></span><span id="rate" class="small">0%</span></div><div class="bar"><i id="rateBar" style="width:0%"></i></div></div>
</section>

<section class="card">
<h2>基本設定</h2>
<div class="notice">入社日から付与日を自動計算できます。一般的な法定付与を基準にしています。</div>
<div class="row form-row">
<div class="field"><label for="join">入社日</label><input id="join" type="date"></div>
<div class="field"><label for="baseDays">今年の付与日数</label><input id="baseDays" type="number" min="0" step="0.5" placeholder="例：10"></div>
</div>
<div class="row" style="margin-top:10px">
<div class="field"><label for="carryIn">前年度からの繰越</label><input id="carryIn" type="number" min="0" max="40" step="0.5" value="0"></div>
<div class="field"><label for="carryLimit">繰越上限</label><input id="carryLimit" type="number" min="0" max="40" step="0.5" value="40"></div>
</div>
<div class="actions"><button class="primary" onclick="saveSettings()">設定を保存</button><button onclick="autoGrant()">付与日数を自動計算</button></div>
</section>

<section class="card">
<h2>有給を登録</h2>
<div class="row form-row">
<div class="field"><label for="useDate">使用日</label><input id="useDate" type="date"></div>
<div class="field"><label for="useDays">使用日数</label><input id="useDays" type="number" min="0.5" step="0.5" value="1"></div>
</div>
<div style="margin-top:10px">
<label for="memo">メモ（任意）</label><input id="memo" placeholder="例：私用、通院など">
</div>
<div class="actions"><button class="primary" onclick="addLeave()">登録する</button><button onclick="bulkOpen()">一括登録</button></div>
</section>

<section class="card" id="bulkCard" style="display:none">
<h2>一括登録</h2>
<div class="small">日付をカンマ・改行区切りで入力できます。例：2026/09/10, 2026/09/11</div>
<textarea id="bulkText" rows="5" style="width:100%;margin-top:8px;border:1px solid #d6deea;border-radius:10px;padding:10px;font:inherit"></textarea>
<div class="actions"><button class="primary" onclick="addBulk()">一括登録する</button><button onclick="document.getElementById('bulkCard').style.display='none'">閉じる</button></div>
</section>

<section class="card">
<div class="calendar-head"><button onclick="moveMonth(-1)">‹</button><h2 id="calTitle" style="margin:0"></h2><button onclick="moveMonth(1)">›</button></div>
<div id="calendar" class="calendar"></div>
</section>

<section class="card">
<h2>使用履歴</h2>
<div class="actions" style="margin-top:0"><select id="historyYear" onchange="render()"></select><button class="danger" onclick="clearAll()">全履歴を削除</button></div>
<div style="overflow:auto"><table><thead><tr><th>日付</th><th>日数</th><th>メモ</th><th></th></tr></thead><tbody id="history"></tbody></table></div>
</section>

<section class="card">
<h2>年度別集計</h2>
<div id="yearSummary"></div>
</section>

<section class="card">
<h2>データ管理</h2>
<div class="small">端末内（SafariのlocalStorage）に保存します。機種変更やSafariのデータ削除前はバックアップしてください。</div>
<div class="actions"><button onclick="exportData()">バックアップを書き出す</button><label style="margin:0"><button onclick="document.getElementById('importFile').click()">バックアップを復元</button><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)"></label></div>
</section>
<footer>有給管理アプリ / Safari対応・レスポンシブ対応</footer>
</main>

<script>
const KEY = "leaveAppDataV2";
let data = JSON.parse(localStorage.getItem(KEY) || '{"settings":{"join":"","baseDays":0,"carryIn":0,"carryLimit":40},"leaves":[]}');
let view = new Date(); view.setDate(1);

function save() {
  localStorage.setItem(KEY, JSON.stringify(data));
}

function fmt(n) {
  return Number.isInteger(n) ? String(n) : Number(n).toFixed(1).replace(/\.0$/, '');
}

// Safariに強い日付パース関数
function parseDate(s) {
  if (!s) return new Date();
  const parts = s.split("-");
  if (parts.length === 3) {
    return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }
  return new Date(s);
}

// 正しい曜日を取得する関数
function getDayOfWeek(dStr) {
  const d = parseDate(dStr);
  if (isNaN(d.getTime())) return "";
  const days = ["日", "月", "火", "水", "木", "金", "土"];
  return days[d.getDay()];
}

function dateKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function todayKey() {
  return dateKey(new Date());
}

function currentYear() {
  return new Date().getFullYear();
}

function autoGrant() {
  const joinVal = document.getElementById("join").value;
  if (!joinVal) {
    alert("先に入社日を入力してください。");
    return;
  }
  const j = parseDate(joinVal);
  if (isNaN(j.getTime())) {
    alert("入社日を正しく入力してください。");
    return;
  }
  const now = new Date();
  // 1. 勤続年数の計算
  let years = now.getFullYear() - j.getFullYear();
  if (now.getMonth() < j.getMonth() || (now.getMonth() === j.getMonth() && now.getDate() < j.getDate())) {
    years--;
  }
  // 2. 法定の今年度付与日数テーブル
  const table = [10, 11, 12, 14, 16, 18, 20];
  const grantDays = table[Math.min(Math.max(years, 0), 6)];

  // 3. 前年度（直前1年間）の使用日数を集計して繰越を自動計算
  const lastYear = now.getFullYear() - 1;
  const lastYearUsed = data.leaves
    .filter(x => parseDate(x.date).getFullYear() === lastYear)
    .reduce((a, x) => a + Number(x.days), 0);

// 前年度の付与日数（概算）から前年度使用分を引いた残数を繰越とする
  const lastYearGrant = table[Math.min(Math.max(years - 1, 0), 6)];
  const estimatedCarry = Math.max(0, lastYearGrant - lastYearUsed);
  const carryLimit = Number(document.getElementById("carryLimit").value) || 40;
  const finalCarry = Math.min(estimatedCarry, carryLimit);

// 4. 画面とデータ構造へ反映
  document.getElementById("baseDays").value = grantDays;
  document.getElementById("carryIn").value = finalCarry;
  
  data.settings.join = joinVal;
  data.settings.baseDays = grantDays;
  data.settings.carryIn = finalCarry;
  
  saveSettings();
  alert(`付与日数 (${grantDays}日) と繰越日数 (${finalCarry}日) を自動計算して設定しました。`);
}

function saveSettings() {
  data.settings.join = document.getElementById("join").value;
  data.settings.baseDays = Math.max(0, Number(document.getElementById("baseDays").value) || 0);
  data.settings.carryIn = Math.min(40, Math.max(0, Number(document.getElementById("carryIn").value) || 0));
  data.settings.carryLimit = Math.min(40, Math.max(0, Number(document.getElementById("carryLimit").value) || 40));
  save();
  render();
}

function addLeave() {
  const d = document.getElementById("useDate").value;
  const days = Number(document.getElementById("useDays").value);
  const memo = document.getElementById("memo").value.trim();

  if (!d || !days || days < 0.5) {
    alert("使用日と日数を入力してください。");
    return;
  }

  data.leaves.push({ date: d, days: days, memo: memo });
  data.leaves.sort((a, b) => a.date.localeCompare(b.date));
  save();

  document.getElementById("memo").value = "";
  render();
}

function bulkOpen() {
  document.getElementById("bulkCard").style.display = "block";
  document.getElementById("bulkText").focus();
}

function addBulk() {
  const dates = document.getElementById("bulkText").value.split(/[,，\n\s]+/).map(x => x.trim()).filter(Boolean);
  if (!dates.length) {
    alert("日付を入力してください。");
    return;
  }
  const normalized = dates.map(x => x.replaceAll("/", "-")).filter(x => /^\d{4}-\d{1,2}-\d{1,2}$/.test(x)).map(x => {
    let [y, m, d] = x.split("-").map(Number);
    return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  });

  normalized.forEach(d => data.leaves.push({ date: d, days: 1, memo: "" }));
  data.leaves.sort((a, b) => a.date.localeCompare(b.date));
  save();
  document.getElementById("bulkText").value = "";
  document.getElementById("bulkCard").style.display = "none";
  render();
}

function removeLeave(i) {
  if (confirm("この履歴を削除しますか？")) {
    data.leaves.splice(i, 1);
    save();
    render();
  }
}

function clearAll() {
  if (confirm("すべての使用履歴を削除しますか？")) {
    data.leaves = [];
    save();
    render();
  }
}

function monthUsed() {
  const y = view.getFullYear();
  const m = view.getMonth() + 1;
  return data.leaves.filter(x => {
    let d = parseDate(x.date);
    return d.getFullYear() === y && (d.getMonth() + 1) === m;
  }).reduce((a, x) => a + Number(x.days), 0);
}

function renderCalendar() {
  const y = view.getFullYear();
  const m = view.getMonth();
  const first = new Date(y, m, 1);
  const last = new Date(y, m + 1, 0);
  document.getElementById("calTitle").textContent = y + "年" + (m + 1) + "月";
  
  let h = ["日", "月", "火", "水", "木", "金", "土"].map(x => `<div class="dow">${x}</div>`).join("");
  for (let i = 0; i < first.getDay(); i++) h += `<div class="day muted"></div>`;
  
  for (let n = 1; n <= last.getDate(); n++) {
    let k = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(n).padStart(2, "0");
    let items = data.leaves.filter(x => x.date === k);
    h += `<div class="day ${k === todayKey() ? "today " : ""}${items.length ? "used" : ""}"><b>${n}</b>${items.map(x => `<span class="mark">休 ${fmt(x.days)}日</span>`).join("")}</div>`;
  }
  document.getElementById("calendar").innerHTML = h;
}

function moveMonth(n) {
  view.setMonth(view.getMonth() + n);
  renderCalendar();
}

function renderHistory() {
  const yearSet = new Set([currentYear()]);
  data.leaves.forEach(x => {
    let y = parseDate(x.date).getFullYear();
    if (!isNaN(y)) yearSet.add(y);
  });
  const years = Array.from(yearSet).sort((a, b) => b - a);

  const sel = document.getElementById("historyYear");
  const oldVal = sel.value;
  sel.innerHTML = years.map(y => `<option value="${y}">${y}年</option>`).join("");
  if (years.includes(Number(oldVal))) sel.value = oldVal;

  const selectedYear = Number(sel.value) || currentYear();
  const rows = data.leaves.map((x, i) => ({ ...x, i }))
    .filter(x => parseDate(x.date).getFullYear() === selectedYear)
    .sort((a, b) => b.date.localeCompare(a.date));

  document.getElementById("history").innerHTML = rows.length ? rows.map(x => {
    const dow = getDayOfWeek(x.date);
    return `<tr><td>${x.date.replaceAll("-", "/")} (${dow})</td><td>${fmt(x.days)}日</td><td>${escapeHtml(x.memo || "")}</td><td><button class="danger" onclick="removeLeave(${x.i})">削除</button></td></tr>`;
  }).join("") : `<tr><td colspan="4" class="empty">履歴はありません</td></tr>`;
}

function renderYearSummary() {
  const yearSet = new Set([currentYear()]);
  data.leaves.forEach(x => {
    let y = parseDate(x.date).getFullYear();
    if (!isNaN(y)) yearSet.add(y);
  });
  const years = Array.from(yearSet).sort((a, b) => b - a);

  const effectiveCarry = Math.min(Number(data.settings.carryIn) || 0, Number(data.settings.carryLimit) || 40);
  const totalAvailable = (Number(data.settings.baseDays) || 0) + effectiveCarry;

  document.getElementById("yearSummary").innerHTML = years.map(y => {
    let used = data.leaves.filter(x => parseDate(x.date).getFullYear() === y).reduce((a, x) => a + Number(x.days), 0);
    let pct = totalAvailable ? Math.min(100, (used / totalAvailable) * 100) : 0;
    return `<div style="margin:12px 0"><div class="row"><b>${y}年</b><span class="grow"></span>${fmt(used)}日使用</div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render() {
  const s = data.settings;
  const baseDays = Number(s.baseDays) || 0; // 今年の付与日数
  const carryIn = Number(s.carryIn) || 0; // 前年度からの繰越
  const carryLimit = Number(s.carryLimit) ?? 40; // 繰越上限

  // 実際に有効な繰越日数（上限を考慮）
  const effectiveCarry = Math.min(carryIn, carryLimit);
 // 総保有日数 = 今年の付与日数 + 有効繰越日数
  const totalAvailable = baseDays + effectiveCarry;
  // 累計使用日数
  const used = data.leaves.reduce((a, x) => a + Number(x.days), 0);
  // 残日数 = 総保有日数 - 使用日数
  const remain = Math.max(0, totalAvailable - used);
  // 使用率（付与日数＋繰越日数の合計に対する消化割合）
  const rate = totalAvailable ? Math.min(100, (used / totalAvailable) * 100) : 0;

  document.getElementById("remain").textContent = fmt(remain) + "日";
  document.getElementById("grant").textContent = fmt(baseDays) + "日";
  document.getElementById("monthUsed").textContent = fmt(monthUsed()) + "日";
  document.getElementById("carry").textContent = fmt(effectiveCarry) + "日";
  document.getElementById("rate").textContent = Math.round(rate) + "%";
  document.getElementById("rateBar").style.width = rate + "%";

  document.getElementById("join").value = s.join || "";
  document.getElementById("baseDays").value = s.baseDays || "";
  document.getElementById("carryIn").value = s.carryIn || 0;
  document.getElementById("carryLimit").value = s.carryLimit ?? 40;

  renderCalendar();
  renderHistory();
  renderYearSummary();
}

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "有給管理バックアップ.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const x = JSON.parse(r.result);
      if (!x.settings || !Array.isArray(x.leaves)) throw 0;
      data = x;
      save();
      render();
      alert("復元しました。");
    } catch {
      alert("バックアップファイルを読み込めませんでした。");
    }
  };
  r.readAsText(f);
  e.target.value = "";
}

// 初期化実行
document.getElementById("useDate").value = todayKey();
render();
</script>
</body>
</html>
